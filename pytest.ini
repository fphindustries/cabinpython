[pytest]
# Pytest configuration for CabinPython v2

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (slower, may need mocks)
    hardware: Hardware tests (require actual devices)
    slow: Slow tests

# Async support
asyncio_mode = auto

# Coverage options (when using pytest-cov)
[coverage:run]
source = cabinpi
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
